<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .neon-bg {
        fill: #0a0a0a;
        stroke: #ff00ff;
        stroke-width: 2;
        filter: url(#neonGlow);
      }
      .terminal-text {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #ff00ff;
        font-weight: bold;
        text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
      }
      .terminal-output {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #00ffff;
        font-weight: bold;
        text-shadow: 0 0 10px #00ffff;
      }
      .terminal-success {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #00ff00;
        font-weight: bold;
        text-shadow: 0 0 10px #00ff00;
      }
      .terminal-warning {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #ffff00;
        font-weight: bold;
        text-shadow: 0 0 10px #ffff00;
      }
      .terminal-error {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #ff0040;
        font-weight: bold;
        text-shadow: 0 0 10px #ff0040;
      }
      .terminal-info {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        fill: #8040ff;
        font-weight: bold;
        text-shadow: 0 0 10px #8040ff;
      }
      .neon-cursor {
        fill: #ff00ff;
        animation: neonBlink 0.8s infinite;
      }
      @keyframes neonBlink {
        0%, 50% { opacity: 1; text-shadow: 0 0 10px #ff00ff; }
        51%, 100% { opacity: 0.3; text-shadow: 0 0 5px #ff00ff; }
      }
    </style>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Neon background -->
  <rect x="0" y="0" width="800" height="400" rx="10" ry="10" class="neon-bg"/>
  
  <!-- Terminal content -->
  
  <text x="20" y="70" class="terminal-text"><tspan opacity="0">$<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.05s" fill="freeze"/></tspan><tspan opacity="0">n<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.1s" fill="freeze"/></tspan><tspan opacity="0">p<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.15s" fill="freeze"/></tspan><tspan opacity="0">m<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.2s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.25s" fill="freeze"/></tspan><tspan opacity="0">i<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.3s" fill="freeze"/></tspan><tspan opacity="0">n<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.35s" fill="freeze"/></tspan><tspan opacity="0">s<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.4s" fill="freeze"/></tspan><tspan opacity="0">t<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.45s" fill="freeze"/></tspan><tspan opacity="0">a<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.5s" fill="freeze"/></tspan><tspan opacity="0">l<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.55s" fill="freeze"/></tspan><tspan opacity="0">l<animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.6s" fill="freeze"/></tspan>
  </text>
  <text x="20" y="90" class="terminal-warning" opacity="0">
    npm WARN deprecated package@1.0.0: Package deprecated
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="1.75s" 
             fill="freeze"/>
  </text>
  <text x="20" y="108" class="terminal-success" opacity="0">
    added 847 packages, and audited 848 packages in 3s
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="3.45s" 
             fill="freeze"/>
  </text>
  <text x="20" y="126" class="terminal-info" opacity="0">
    ✓ 142 packages are looking for funding
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="3.95s" 
             fill="freeze"/>
  </text>
  <text x="20" y="144" class="terminal-success" opacity="0">
    found 0 vulnerabilities
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="4.15s" 
             fill="freeze"/>
  </text>
  <text x="20" y="170" class="terminal-text"><tspan opacity="0">$<animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.65s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.7s" fill="freeze"/></tspan><tspan opacity="0">n<animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.75s" fill="freeze"/></tspan><tspan opacity="0">p<animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.800000000000001s" fill="freeze"/></tspan><tspan opacity="0">m<animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.8500000000000005s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.9s" fill="freeze"/></tspan><tspan opacity="0">r<animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.95s" fill="freeze"/></tspan><tspan opacity="0">u<animate attributeName="opacity" values="0;1" dur="0.05s" begin="5s" fill="freeze"/></tspan><tspan opacity="0">n<animate attributeName="opacity" values="0;1" dur="0.05s" begin="5.050000000000001s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="5.1000000000000005s" fill="freeze"/></tspan><tspan opacity="0">d<animate attributeName="opacity" values="0;1" dur="0.05s" begin="5.15s" fill="freeze"/></tspan><tspan opacity="0">e<animate attributeName="opacity" values="0;1" dur="0.05s" begin="5.2s" fill="freeze"/></tspan><tspan opacity="0">v<animate attributeName="opacity" values="0;1" dur="0.05s" begin="5.25s" fill="freeze"/></tspan>
  </text>
  <text x="20" y="190" class="terminal-output" opacity="0">
    &gt; project@0.1.0 dev
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="5.9s" 
             fill="freeze"/>
  </text>
  <text x="20" y="208" class="terminal-output" opacity="0">
    &gt; next dev
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="6.1000000000000005s" 
             fill="freeze"/>
  </text>
  <text x="20" y="226" class="terminal-info" opacity="0">
       ▲ Next.js 14.0.0
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="6.6000000000000005s" 
             fill="freeze"/>
  </text>
  <text x="20" y="244" class="terminal-success" opacity="0">
       - Local:        http://localhost:3000
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="7.1000000000000005s" 
             fill="freeze"/>
  </text>
  <text x="20" y="262" class="terminal-success" opacity="0">
       - Network:      http://192.168.1.100:3000
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="7.300000000000001s" 
             fill="freeze"/>
  </text>
  <text x="20" y="280" class="terminal-success" opacity="0">
     ✓ Ready in 2.3s
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="7.9s" 
             fill="freeze"/>
  </text>
  <text x="20" y="306" class="terminal-text"><tspan opacity="0">$<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.4s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.450000000000001s" fill="freeze"/></tspan><tspan opacity="0">e<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.5s" fill="freeze"/></tspan><tspan opacity="0">c<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.55s" fill="freeze"/></tspan><tspan opacity="0">h<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.6s" fill="freeze"/></tspan><tspan opacity="0">o<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.65s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.700000000000001s" fill="freeze"/></tspan><tspan opacity="0">&quot;<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.75s" fill="freeze"/></tspan><tspan opacity="0">H<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.8s" fill="freeze"/></tspan><tspan opacity="0">e<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.85s" fill="freeze"/></tspan><tspan opacity="0">l<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.9s" fill="freeze"/></tspan><tspan opacity="0">l<animate attributeName="opacity" values="0;1" dur="0.05s" begin="8.950000000000001s" fill="freeze"/></tspan><tspan opacity="0">o<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9s" fill="freeze"/></tspan><tspan opacity="0"> <animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.05s" fill="freeze"/></tspan><tspan opacity="0">W<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.1s" fill="freeze"/></tspan><tspan opacity="0">o<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.15s" fill="freeze"/></tspan><tspan opacity="0">r<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.200000000000001s" fill="freeze"/></tspan><tspan opacity="0">l<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.25s" fill="freeze"/></tspan><tspan opacity="0">d<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.3s" fill="freeze"/></tspan><tspan opacity="0">&quot;<animate attributeName="opacity" values="0;1" dur="0.05s" begin="9.35s" fill="freeze"/></tspan>
  </text>
  <text x="20" y="326" class="terminal-output" opacity="0">
    Hello World
    <animate attributeName="opacity" 
             values="0;1" 
             dur="0.2s" 
             begin="9.9s" 
             fill="freeze"/>
  </text>
  
  
  <!-- Neon cursor -->
  <text x="20" y="352" class="neon-cursor">▋</text>
  
</svg>
