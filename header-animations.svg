<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <!-- Premium Animated Gradient -->
<linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" style="stop-color:#c31432">
    <animate attributeName="stop-color" values="#c31432;#240b36;#c31432" dur="6s" repeatCount="indefinite"/>
  </stop>
  <stop offset="50%" style="stop-color:#740f34">
    <animate attributeName="stop-color" values="#740f34;#c31432;#240b36;#740f34" dur="6s" repeatCount="indefinite"/>
  </stop>
  <stop offset="100%" style="stop-color:#240b36">
    <animate attributeName="stop-color" values="#240b36;#c31432;#240b36" dur="6s" repeatCount="indefinite"/>
  </stop>
</linearGradient>
    
    <!-- Text Shadow -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#667eea" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Clean Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Accent Line Top -->
  <rect x="0" y="0" width="900" height="3" fill="url(#premiumGradient)"/>
  
  <!-- Main Name Text -->
  <g filter="url(#textShadow)">
    <text x="450" y="75" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="700" fill="url(#premiumGradient)" letter-spacing="3">
      NANDHAN KK
    </text>
  </g>
  
  <!-- Subtitle -->
  <text x="450" y="115" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif" font-size="16" fill="#9ca3af" letter-spacing="4">
    CYBER SECURITY  •  OFFENSIVE SECURITY  •  ENGINEER
  </text>
  
  <!-- Decorative Elements -->
  <g opacity="0.6">
    <line x1="120" y1="140" x2="380" y2="140" stroke="url(#premiumGradient)" stroke-width="1">
      <animate attributeName="x2" values="120;380" dur="1s" fill="freeze"/>
    </line>
    <line x1="520" y1="140" x2="780" y2="140" stroke="url(#premiumGradient)" stroke-width="1">
      <animate attributeName="x1" values="780;520" dur="1s" fill="freeze"/>
    </line>
  </g>
  
  
  <!-- Accent Line Bottom -->
  <rect x="0" y="177" width="900" height="3" fill="url(#premiumGradient)"/>
</svg>
