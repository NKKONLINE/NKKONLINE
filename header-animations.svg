<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="premiumGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2a6c">
        <animate attributeName="stop-color" values="#1a2a6c;#7303c0;#1a2a6c" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="33%" style="stop-color:#7303c0">
        <animate attributeName="stop-color" values="#7303c0:#7F00FF;#1a2a6c;#7303c0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="66%" style="stop-color:#7F00FF">
        <animate attributeName="stop-color" values="#7F00FF;#fdeff9;#7303c0;#7F00FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#fdeff9">
        <animate attributeName="stop-color" values="#fdeff9;#7F00FF;#1a2a6c;#fdeff9" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7F00FF" flood-opacity="0.5"/>
    </filter>

    <filter id="heavyGlitch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="glitch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise">
        <animate attributeName="baseFrequency" values="0.65;0.68;0.65" dur="0.3s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" result="displaced">
        <animate attributeName="scale" values="0;0;0;8;0;6;0;0;0;0;0;0;0;0;0;4;0;0;0" dur="4s" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feBlend in="SourceGraphic" in2="displaced" mode="normal">
        <animate attributeName="mode" values="normal;normal;normal;screen;normal;multiply;normal;normal;normal;normal;normal;normal;normal;normal;normal;screen;normal;normal;normal" dur="4s" repeatCount="indefinite"/>
      </feBlend>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <clipPath id="revealClip">
      <rect x="0" y="0" width="900" height="180">
        <animate attributeName="width" values="0;300;150;600;450;900" dur="0.8s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <rect x="0" y="0" width="900" height="3" fill="url(#premiumGradient)"/>

  <g filter="url(#heavyGlitch)" opacity="0">
    <text x="442" y="73" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="52" font-weight="900"
          fill="#00f0ff" letter-spacing="4">
      N4X#D@N %K
    </text>
    <animate attributeName="opacity" values="0;0.8;0;0.5;0" dur="0.6s" fill="freeze" />
  </g>

  <g filter="url(#heavyGlitch)" opacity="0">
    <text x="458" y="77" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="52" font-weight="900"
          fill="#ff0055" letter-spacing="2">
      9A&amp;DH4N K1
    </text>
    <animate attributeName="opacity" values="0;0.9;0;0.7;0" dur="0.7s" begin="0.1s" fill="freeze" />
  </g>

  <g filter="url(#textShadow)">
    <text x="450" y="75" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="48" font-weight="700"
          fill="url(#premiumGradient)" letter-spacing="3" opacity="1">
      X4#@9K%2&amp;1
      <animate attributeName="opacity" values="1;0;1;0" dur="0.3s" fill="freeze"/>
      <animate attributeName="x" values="450;445;455;450" dur="0.3s" repeatCount="1"/>
    </text>

    <text x="450" y="75" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="48" font-weight="700"
          fill="url(#premiumGradient)" letter-spacing="3" opacity="0">
      N$#D_H%^N*!
      <animate attributeName="opacity" values="0;1;0;1;0" dur="0.4s" begin="0.2s" fill="freeze"/>
      <animate attributeName="x" values="450;458;442;450" dur="0.4s" begin="0.2s" repeatCount="1"/>
    </text>

    <text x="450" y="75" text-anchor="middle"
          font-family="'Courier New', monospace" font-size="48" font-weight="700"
          fill="url(#premiumGradient)" letter-spacing="3" opacity="0">
      NA_DHAN KK
      <animate attributeName="opacity" values="0;1;1;0" dur="0.3s" begin="0.6s" fill="freeze"/>
      <animate attributeName="x" values="450;448;452;450" dur="0.3s" begin="0.6s" repeatCount="1"/>
    </text>
  </g>

  <g filter="url(#glitch)">
    <g filter="url(#textShadow)" clip-path="url(#revealClip)">
      <text x="450" y="75" text-anchor="middle"
            font-family="'Segoe UI', 'SF Pro Display', -apple-system, sans-serif"
            font-size="48" font-weight="700"
            fill="url(#premiumGradient)" letter-spacing="3" opacity="0">
        NANDHAN KK
        <animate attributeName="opacity" values="0;0;1" dur="0.9s" fill="freeze"/>
      </text>
    </g>
  </g>




  <rect x="0" y="177" width="900" height="3" fill="url(#premiumGradient)"/>
</svg>
