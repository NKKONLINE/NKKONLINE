<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="60" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .wave-text {
        font-family: JetBrains Mono, monospace;
        font-size: 20px;
        fill: #ffffff;
        font-weight: 600;
        text-rendering: optimizeLegibility;
      }
      .wave-cursor {
        fill: #ffffff;
        animation: waveBlink 1.0s ease-in-out infinite;
      }
      @keyframes waveBlink {
        0%, 45% { opacity: 1; transform: translateY(0); }
        50%, 95% { opacity: 0.6; transform: translateY(-0.3px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .wave-char {
        opacity: 0;
        animation: waveType 0.7s linear 0.5s forwards, wave 2.5s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .emoji-icon {
        opacity: 0;
        animation: waveType 0.7s linear 0.5s forwards, waveEmoji 2.5s ease-in-out infinite;
        transform-origin: center center;
      }
      @keyframes waveType {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes wave {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes waveEmoji {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-1.5px) scale(1.02); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-char, .emoji-icon { animation: none; opacity: 1; transform: translateY(0); }
        .wave-cursor { animation: none; opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>
  
  <rect width="400" height="60" fill="#1a1a1a" rx="3"/>
  
  <g class="wave-text">
    <text x="20" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0s, 0s">N</tspan>
                </text><text x="32" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.07s, 0.15s">A</tspan>
                </text><text x="44" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.14s, 0.3s">N</tspan>
                </text><text x="56" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.21s, 0.44999999999999996s">D</tspan>
                </text><text x="68" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.28s, 0.6s">H</tspan>
                </text><text x="80" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.35s, 0.75s">A</tspan>
                </text><text x="92" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.42s, 0.8999999999999999s">N</tspan>
                </text><text x="104" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.49s, 1.05s">&#160;</tspan>
                </text><text x="116" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.56s, 1.2s">K</tspan>
                </text><text x="128" y="36.666666666666664" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.63s, 1.3499999999999999s">K</tspan>
                </text>
    
    
  </g>
</svg>
