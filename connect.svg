<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 115" width="100%">
  <style>
    @keyframes gs1 { 0%,100%{ stop-color:#00c1ff } 50%{ stop-color:#0077b6 } }
    @keyframes gs2 { 0%,100%{ stop-color:#0077b6 } 50%{ stop-color:#00c1ff } }
    .s1{animation:gs1 3s infinite} .s2{animation:gs2 3s infinite}
    .ic{transition:transform 0.18s ease;transform-box:fill-box;transform-origin:center}
    .ic:hover{transform:scale(1.12)}
  </style>
  <defs>
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="s1"/><stop offset="100%" class="s2"/>
    </linearGradient>
    <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFDC80"/>
      <stop offset="25%"  stop-color="#FCAF45"/>
      <stop offset="50%"  stop-color="#F77737"/>
      <stop offset="75%"  stop-color="#C13584"/>
      <stop offset="100%" stop-color="#833AB4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

