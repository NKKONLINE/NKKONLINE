<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <style>
    @keyframes gradientShift {
      0% { stop-color: #c31432; }
      50% { stop-color: #240b36; }
      100% { stop-color: #c31432; }
    }
    @keyframes gradientShift2 {
      0% { stop-color: #240b36; }
      50% { stop-color: #c31432; }
      100% { stop-color: #240b36; }
    }
    .stop1 { animation: gradientShift 6s infinite; }
    .stop2 { animation: gradientShift2 6s infinite; }
    .profile-icon {
      transition: transform 0.2s ease-in-out;
      transform-origin: center;
    }
    .profile-icon:hover { transform: scale(1.08); }
  </style>
  <defs>
    <linearGradient id="glowBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="stop1" />
      <stop offset="100%" class="stop2" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="480" height="110" rx="12" fill="#0d1117" />
  <rect x="10" y="10" width="480" height="110" rx="12" fill="none" stroke="url(#glowBoxGrad)" stroke-width="3" filter="url(#neonGlow)" opacity="0.8" />
  <rect x="10" y="10" width="480" height="110" rx="12" fill="none" stroke="url(#glowBoxGrad)" stroke-width="1.5" />

