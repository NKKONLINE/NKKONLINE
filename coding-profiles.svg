<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <style>
    /* Gradient Border Animation Loop */
    @keyframes gradientShift {
      0% { stop-color: #c31432; }
      50% { stop-color: #240b36; }
      100% { stop-color: #c31432; }
    }
    @keyframes gradientShift2 {
      0% { stop-color: #240b36; }
      50% { stop-color: #c31432; }
      100% { stop-color: #240b36; }
    }
    .stop1 { animation: gradientShift 6s infinite; }
    .stop2 { animation: gradientShift2 6s infinite; }

    /* Smooth Hover Scaling for Icons */
    .profile-icon {
      transition: transform 0.2s ease-in-out;
      transform-origin: center;
    }
    .profile-icon:hover {
      transform: scale(1.08);
    }
  </style>

  <defs>
    <linearGradient id="glowBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="stop1" />
      <stop offset="100%" class="stop2" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="480" height="110" rx="12" fill="#0d1117" />

  <rect x="10" y="10" width="480" height="110" rx="12" fill="none" stroke="url(#glowBoxGrad)" stroke-width="3" filter="url(#neonGlow)" opacity="0.8" />

  <rect x="10" y="10" width="480" height="110" rx="12" fill="none" stroke="url(#glowBoxGrad)" stroke-width="1.5" />

  <g transform="translate(30, 30)">
    <a href="https://leetcode.com/u/x__nandhan__x/" target="_blank">
      <g class="profile-icon" transform="translate(20, 10)">
        <image href="https://img.shields.io/badge/-FFA116?style=for-the-badge&amp;logo=leetcode&amp;logoColor=black" width="90" height="35" />
      </g>
    </a>

    <a href="https://www.geeksforgeeks.org/profile/nandhank7d1f" target="_blank">
      <g class="profile-icon" transform="translate(130, 10)">
        <image href="https://img.shields.io/badge/-2F8D46?style=for-the-badge&amp;logo=geeksforgeeks&amp;logoColor=white" width="90" height="35" />
      </g>
    </a>

    <a href="https://www.hackerrank.com/nandhankkonline" target="_blank">
      <g class="profile-icon" transform="translate(240, 10)">
        <image href="https://img.shields.io/badge/-00EA64?style=for-the-badge&amp;logo=hackerrank&amp;logoColor=black" width="90" height="35" />
      </g>
    </a>

    <a href="https://www.codechef.com/users/nandhan_kk" target="_blank">
      <g class="profile-icon" transform="translate(350, 10)">
        <image href="https://img.shields.io/badge/-5B4638?style=for-the-badge&amp;logo=codechef&amp;logoColor=white" width="90" height="35" />
      </g>
    </a>
  </g>
</svg>
