<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="60" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .wave-text {
        font-family: JetBrains Mono, monospace;
        font-size: 12px;
        fill: #ffffff;
        font-weight: 600;
        text-rendering: optimizeLegibility;
      }
      .wave-cursor {
        fill: #ffffff;
        animation: waveBlink 1.0s ease-in-out infinite;
      }
      @keyframes waveBlink {
        0%, 45% { opacity: 1; transform: translateY(0); }
        50%, 95% { opacity: 0.6; transform: translateY(-0.3px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .wave-char {
        opacity: 0;
        animation: waveType 1.05s linear 0.5s forwards, wave 2.5s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .emoji-icon {
        opacity: 0;
        animation: waveType 1.05s linear 0.5s forwards, waveEmoji 2.5s ease-in-out infinite;
        transform-origin: center center;
      }
      @keyframes waveType {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes wave {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes waveEmoji {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-1.5px) scale(1.02); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-char, .emoji-icon { animation: none; opacity: 1; transform: translateY(0); }
        .wave-cursor { animation: none; opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>
  
  <rect width="400" height="60" fill="#0D1117" rx="3"/>
  
  <g class="wave-text">
    <text x="20" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0s, 0s">S</tspan>
                </text><text x="27.2" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.05s, 0.15s">p</tspan>
                </text><text x="34.4" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.1s, 0.3s">e</tspan>
                </text><text x="41.599999999999994" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.15s, 0.44999999999999996s">c</tspan>
                </text><text x="48.8" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.2s, 0.6s">i</tspan>
                </text><text x="56" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.25s, 0.75s">e</tspan>
                </text><text x="63.199999999999996" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.3s, 0.8999999999999999s">s</tspan>
                </text><text x="70.4" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.35s, 1.05s">:</tspan>
                </text><text x="77.6" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.4s, 1.2s">&#160;</tspan>
                </text><text x="84.8" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.45s, 1.3499999999999999s">H</tspan>
                </text><text x="92" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.5s, 1.5s">o</tspan>
                </text><text x="99.2" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.55s, 1.65s">m</tspan>
                </text><text x="106.39999999999999" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.6s, 1.7999999999999998s">o</tspan>
                </text><text x="113.6" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.65s, 1.95s">&#160;</tspan>
                </text><text x="120.8" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.7s, 2.1s">s</tspan>
                </text><text x="128" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.75s, 2.25s">a</tspan>
                </text><text x="135.2" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.8s, 2.4s">p</tspan>
                </text><text x="142.39999999999998" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.85s, 2.55s">i</tspan>
                </text><text x="149.6" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.9s, 2.6999999999999997s">e</tspan>
                </text><text x="156.79999999999998" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 0.95s, 2.85s">n</tspan>
                </text><text x="164" y="34" class="wave-text">
                  <tspan class="wave-char" style="animation-delay: 1s, 3s">s</tspan>
                </text>
    
    
  </g>
</svg>
